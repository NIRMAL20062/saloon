name: Android CI

# Runs on every push (any branch) and every pull request into main.
# What "CI" means here, concretely: prove the app still builds and every
# unit test still passes, on a clean machine, before code lands on main —
# catching what a local build might miss (e.g. a change that only worked
# because of stale local Gradle cache).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache/restore Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties from repo secrets
        # local.properties is git-ignored (it holds the Supabase URL/anon key and
        # the local SDK path) — CI has no working directory to read it from, so
        # it's reconstructed here from GitHub Actions repo secrets instead. Only
        # the public-safe Supabase URL/anon key ever go here — never a service-role
        # or Razorpay secret key.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anonKey=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test results (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-native/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
